<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
<title>Arshia Rahnama - FiveM / VMP Developer, Marketplace Builder, Web Developer</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#F5D27A"/><stop offset="0.55" stop-color="#E8B84B"/><stop offset="1" stop-color="#C8922A"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#E8B84B" stop-opacity="0.75"/><stop offset="0.5" stop-color="#334155" stop-opacity="0.6"/><stop offset="1" stop-color="#E8B84B" stop-opacity="0.15"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
</defs>
<style>
text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace}

@media (prefers-reduced-motion: no-preference){
  .g1{animation:d1 14s ease-in-out infinite alternate}
  .g2{animation:d2 18s ease-in-out infinite alternate}
  .dot{animation:pulse 2.2s ease-in-out infinite}
  .shim{animation:shim 6s ease-in-out infinite}
}
@keyframes d1{from{transform:translate(0,0)}to{transform:translate(-90px,40px)}}
@keyframes d2{from{transform:translate(0,0)}to{transform:translate(80px,-30px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shim{0%,100%{opacity:.55}50%{opacity:1}}

</style>

<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
  <radialGradient id="fade" cx="0.7" cy="0.3" r="0.9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="1200" height="330" fill="url(#fade)"/></mask>
  <linearGradient id="name" x1="64" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5D27A"/>
  </linearGradient>
  <clipPath id="rc"><rect width="1200" height="330" rx="22"/></clipPath>
</defs>
<g clip-path="url(#rc)">
  <rect width="1200" height="330" fill="#0B1020"/>
  <rect width="1200" height="330" fill="url(#grid)" mask="url(#gm)"/>
  <circle class="g1" cx="1000" cy="60" r="190" fill="#E8B84B" opacity="0.20" filter="url(#blur)"/>
  <circle class="g2" cx="230" cy="340" r="170" fill="#4F46E5" opacity="0.16" filter="url(#blur)"/>
  <rect y="326" width="1200" height="4" fill="url(#gold)" class="shim"/>
</g>
<rect x="1" y="1" width="1198" height="328" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

<text class="m" x="64" y="84" font-size="14" fill="#E8B84B" letter-spacing="3">// PORTFOLIO  ·  2026</text>
<text x="64" y="168" font-size="60" font-weight="800" letter-spacing="3" fill="url(#name)">ARSHIA RAHNAMA</text>
<text class="m" x="64" y="212" font-size="17" fill="#94A3B8">FiveM / VMP Developer <tspan fill="#E8B84B">·</tspan> Marketplace Builder <tspan fill="#E8B84B">·</tspan> Web Developer</text>

<rect x="64" y="244" width="262" height="38" rx="19" fill="#111A2E" stroke="#E8B84B" stroke-opacity="0.35"/>
<circle class="dot" cx="87" cy="263" r="5" fill="#22C55E"/>
<text x="104" y="268" font-size="14.5" font-weight="600" fill="#F8FAFC">Building Unique Market</text>

<!-- code card -->
<g>
  <rect x="790" y="50" width="346" height="232" rx="16" fill="#111A2E" fill-opacity="0.82" stroke="url(#edge)"/>
  <circle cx="816" cy="76" r="5.5" fill="#FF5F57"/><circle cx="836" cy="76" r="5.5" fill="#FEBC2E"/><circle cx="856" cy="76" r="5.5" fill="#28C840"/>
  <line x1="790" y1="97" x2="1136" y2="97" stroke="#fff" stroke-opacity="0.07"/>
  <g class="m" font-size="14.5">
    <text x="816" y="128"><tspan fill="#C084FC">const</tspan> <tspan fill="#E8B84B">arshia</tspan> <tspan fill="#94A3B8">= {</tspan></text>
    <text x="840" y="156"><tspan fill="#7DD3FC">role</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#86EFAC">"FiveM / VMP Dev"</tspan><tspan fill="#94A3B8">,</tspan></text>
    <text x="840" y="184"><tspan fill="#7DD3FC">stack</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#86EFAC">"Lua · PHP · JS"</tspan><tspan fill="#94A3B8">,</tspan></text>
    <text x="840" y="212"><tspan fill="#7DD3FC">shipped</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#E8B84B">17</tspan><tspan fill="#94A3B8">,</tspan></text>
    <text x="840" y="240"><tspan fill="#7DD3FC">status</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#86EFAC">"building"</tspan></text>
    <text x="816" y="268" fill="#94A3B8">};</text>
  </g>
</g>

</svg>
