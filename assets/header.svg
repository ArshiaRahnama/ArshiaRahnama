<g clip-path="url(#rc)">
  <rect width="1200" height="270" fill="#0B1020"/>
  <ellipse class="glow" cx="600" cy="-10" rx="300" ry="110" fill="#E8B84B" opacity="0.16" filter="url(#blur)"/>
  <rect class="line" x="0" y="0" width="1200" height="2" fill="url(#hair)"/>
</g>
<rect x="0.75" y="0.75" width="1198.5" height="268.5" rx="21.5" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
<text class="m" x="600" y="82" font-size="13" fill="#E8B84B" letter-spacing="6" text-anchor="middle">2025</text>
