  <stop offset="0" stop-color="#E8B84B" stop-opacity="0"/><stop offset="0.5" stop-color="#E8B84B" stop-opacity="0.9"/><stop offset="1" stop-color="#E8B84B" stop-opacity="0"/>
</linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5D27A"/><stop offset="1" stop-color="#E8B84B"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
</defs><style>text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace}@media (prefers-reduced-motion: no-preference){.glow{animation:g 16s ease-in-out infinite alternate}.line{animation:l 7s ease-in-out infinite}}
